version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Writing tamp's own output to a terminal is best-effort: there is no
      # meaningful recovery from a failed write to stdout or stderr.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
