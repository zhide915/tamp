name: E2E

# None of the ignored paths are exercised by this job.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - scripts/acceptance-macos.sh
      - scripts/acceptance-windows.ps1
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - scripts/acceptance-macos.sh
      - scripts/acceptance-windows.ps1
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

# The event name keeps a push from cancelling a scheduled run.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tamp
        run: go build -o tamp ./cmd/tamp

      - name: End-to-end
        run: bash scripts/e2e.sh "$PWD/tamp"
